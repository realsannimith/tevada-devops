name: Build Desktop (unsigned)

# Builds installable artifacts for every platform on each push to main (and on
# demand), mirroring FCode's build-desktop workflow. Unsigned — signing/
# notarization is a separate concern (needs Apple/Azure certs); these artifacts
# are for testing and internal distribution.
#
# The Google Drive OAuth client id/secret and the GitHub App client id/slug are
# injected from repository secrets into the build environment; vite.main.config.ts
# bakes them into the production main bundle. They are NEVER committed. If a
# secret is unset the corresponding feature is simply disabled in the build.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            arch: arm64
          - label: macOS x64
            runner: macos-13
            arch: x64
          - label: Linux x64
            runner: ubuntu-24.04
            arch: x64
          - label: Windows x64
            runner: windows-2022
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # Squirrel.Windows post-install scripts can trip the bun installer on
      # Windows runners; skip lifecycle scripts there (matches FCode).
      - name: Install dependencies
        if: ${{ runner.os != 'Windows' }}
        run: bun install --frozen-lockfile

      - name: Install dependencies (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: bun install --frozen-lockfile --ignore-scripts

      # electron-forge's deb/rpm makers need these packaging tools on Linux.
      - name: Install Linux packaging tools
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg rpm

      - name: Make distributables
        shell: bash
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_APP_SLUG: ${{ secrets.APP_GITHUB_APP_SLUG }}
        run: bun run make -- --arch=${{ matrix.arch }}

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          shopt -s nullglob globstar
          # electron-forge writes distributables under out/make/**.
          for f in out/make/**/*.zip \
                   out/make/**/*.dmg \
                   out/make/**/*.exe \
                   out/make/**/*.nupkg \
                   out/make/**/*.deb \
                   out/make/**/*.rpm \
                   out/make/**/RELEASES; do
            cp "$f" build-output/ 2>/dev/null || true
          done
          echo "Collected:" && ls -la build-output

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tevada-desktop-${{ matrix.arch }}-${{ runner.os }}
          path: build-output/*
          if-no-files-found: error
          retention-days: 14
